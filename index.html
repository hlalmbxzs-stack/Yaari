<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>यारी</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&family=Hind:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#1b1530;--card:#2a2250;--ink:#f6f1ff;--mute:#a49bc8;--gold:#ffb627;--red:#ff4d5e;box-sizing:border-box}
*{box-sizing:inherit;margin:0}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 Hind,"Noto Sans Devanagari",system-ui,sans-serif}
h1,h2,button,.tab{font-family:"Baloo 2",Hind,system-ui,sans-serif}
#login{height:100%;display:grid;place-content:center;gap:14px;text-align:center;padding:24px}
#login h1{font-size:64px;color:var(--gold);line-height:1}
button{cursor:pointer;border:0;border-radius:12px;padding:10px 18px;background:var(--gold);color:#2a1d00;font-size:16px;font-weight:700}
button.alt{background:var(--card);color:var(--ink)}
button.red{background:var(--red);color:#fff}
button:disabled{opacity:.5}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
input{width:100%;padding:10px 12px;border-radius:12px;border:1px solid #4a3f7d;background:var(--card);color:var(--ink);font:inherit}
#app{height:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 16px}
header h1{font-size:26px;color:var(--gold)}
header span{color:var(--mute);margin-right:10px}
header button{padding:6px 12px;font-size:14px}
main{flex:1;min-height:0;position:relative}
.pane{position:absolute;inset:0;display:none;flex-direction:column;padding:8px 16px;gap:10px;overflow:auto}
.pane.on{display:flex}
.row{display:flex;gap:8px}
#msgs{flex:1;overflow:auto;display:flex;flex-direction:column;gap:6px;min-height:0}
.b{max-width:80%;background:var(--card);padding:6px 12px;border-radius:14px 14px 14px 4px;overflow-wrap:anywhere}
.b b{display:block;font-size:13px;color:var(--gold)}
.b.me{align-self:flex-end;background:var(--gold);color:#2a1d00;border-radius:14px 14px 4px 14px}
.stage{position:relative;background:#000;border-radius:16px;overflow:hidden;aspect-ratio:3/4;max-height:52dvh;width:100%;margin:0 auto}
.stage video{width:100%;height:100%;object-fit:cover}
#lv{position:absolute;right:8px;bottom:8px;width:28%;height:auto;border-radius:10px;border:2px solid var(--bg)}
.code{background:var(--card);border-radius:12px;padding:8px 12px;color:var(--mute)}
.code b{color:var(--gold);font-size:20px}
nav{display:flex;background:var(--card);padding-bottom:env(safe-area-inset-bottom)}
.tab{flex:1;background:none;color:var(--mute);border-radius:0;padding:14px 4px}
.tab.on{color:var(--gold);box-shadow:inset 0 3px var(--gold)}
#toast{position:fixed;left:16px;right:16px;bottom:88px;background:var(--red);color:#fff;padding:10px 14px;border-radius:12px;z-index:9}
@media (prefers-reduced-motion:no-preference){.pane.on{animation:f .15s}@keyframes f{from{opacity:.4}}}
</style>
</head>
<body>

<section id="login">
  <h1>यारी</h1>
  <p>दोस्तों से चैट करो, वीडियो कॉल करो और लाइव जाओ।</p>
  <button id="gbtn">Google से लॉगिन करो</button>
</section>

<div id="app" hidden>
  <header><h1>यारी</h1><div><span id="me"></span><button class="alt" id="out">बाहर निकलो</button></div></header>
  <main>
    <section class="pane on" id="p-chat">
      <div class="row"><input id="room" placeholder="रूम का नाम (जैसे dost)" aria-label="रूम का नाम"><button id="joinb">जुड़ो</button></div>
      <div id="msgs"></div>
      <form class="row" id="sf"><input id="tx" placeholder="मैसेज लिखो" autocomplete="off" aria-label="मैसेज"><button>भेजो</button></form>
    </section>

    <section class="pane" id="p-call">
      <div class="code">तुम्हारा कोड: <b class="myid">...</b> <button class="alt" data-copy style="padding:4px 10px;font-size:13px">कॉपी</button></div>
      <div class="row"><input id="fid" placeholder="दोस्त का कोड" aria-label="दोस्त का कोड"><button id="call">कॉल करो</button></div>
      <div class="stage"><video id="rv" autoplay playsinline></video><video id="lv" autoplay playsinline muted></video></div>
      <button class="red" id="end">कॉल खत्म करो</button>
    </section>

    <section class="pane" id="p-live">
      <div class="code">तुम्हारा कोड: <b class="myid">...</b> <button class="alt" data-copy style="padding:4px 10px;font-size:13px">कॉपी</button></div>
      <button id="golive">लाइव शुरू करो</button>
      <div id="hostinfo" hidden class="row" style="justify-content:space-between;align-items:center"><span id="vc">0 लोग देख रहे हैं</span><button class="red" id="stoplive">लाइव बंद करो</button></div>
      <div class="row"><input id="hid" placeholder="जिसकी लाइव देखनी है उसका कोड" aria-label="लाइव का कोड"><button id="watch">लाइव देखो</button></div>
      <div class="stage"><video id="sv" autoplay playsinline></video></div>
    </section>
  </main>
  <nav>
    <button class="tab on" data-t="chat">चैट</button>
    <button class="tab" data-t="call">वीडियो कॉल</button>
    <button class="tab" data-t="live">लाइव</button>
  </nav>
</div>
<div id="toast" hidden></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
// ====== यहाँ अपना firebaseConfig डालो (Firebase कंसोल से कॉपी किया हुआ) ======
const cfg = {
  apiKey: "AIzaSyCMsgISlvV2Qf3uJtviOb3jOTKSkXSRuk8",
  authDomain: "yaari-884fc.firebaseapp.com",
  projectId: "yaari-884fc",
  appId: "1:33253260481:web:1c484f7d3e123f37b26840"
};
// ==========================================================================

const $ = s => document.querySelector(s);
let user, db, unsub, room = 'dost', peer, local, cur, hosting = false;
const viewers = new Set();

function toast(t){const e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>e.hidden=true,3500)}

/* ---------- लॉगिन ---------- */
if (cfg.apiKey.startsWith('YOUR')) {
  $('#login p').textContent = 'पहले कोड में अपना firebaseConfig डालो।';
  $('#gbtn').disabled = true;
} else {
  firebase.initializeApp(cfg);
  db = firebase.firestore();
  $('#gbtn').onclick = () => firebase.auth().signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e => toast(e.message));
  firebase.auth().onAuthStateChanged(u => {
    user = u; $('#login').hidden = !!u; $('#app').hidden = !u;
    if (u) { $('#me').textContent = u.displayName || 'दोस्त'; join('dost'); initPeer(); }
  });
}
$('#out').onclick = () => firebase.auth().signOut().then(() => location.reload());

/* ---------- टैब ---------- */
document.querySelectorAll('.tab').forEach(b => b.onclick = () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === b));
  document.querySelectorAll('.pane').forEach(p => p.classList.toggle('on', p.id === 'p-' + b.dataset.t));
});
document.querySelectorAll('[data-copy]').forEach(b => b.onclick = () =>
  navigator.clipboard.writeText($('.myid').textContent).then(() => toast('कोड कॉपी हो गया')));

/* ---------- चैट ---------- */
function join(r) {
  room = (r || 'dost').trim().toLowerCase() || 'dost';
  $('#room').value = room;
  unsub && unsub();
  const box = $('#msgs');
  box.innerHTML = '';
  unsub = db.collection('rooms').doc(room).collection('m').orderBy('t').limitToLast(100).onSnapshot(s => {
    box.innerHTML = '';
    s.forEach(d => {
      const m = d.data(), el = document.createElement('div');
      el.className = 'b' + (m.u === user.uid ? ' me' : '');
      if (m.u !== user.uid) { const n = document.createElement('b'); n.textContent = m.n; el.append(n); }
      el.append(m.x);
      box.append(el);
    });
    box.scrollTop = box.scrollHeight;
  }, e => toast('चैट नहीं खुली: ' + e.code));
}
$('#joinb').onclick = () => join($('#room').value);
$('#sf').onsubmit = e => {
  e.preventDefault();
  const x = $('#tx').value.trim();
  if (!x) return;
  $('#tx').value = '';
  db.collection('rooms').doc(room).collection('m').add({
    x, u: user.uid, n: user.displayName || 'दोस्त',
    t: firebase.firestore.FieldValue.serverTimestamp()
  }).catch(e => toast('मैसेज नहीं गया: ' + e.code));
};

/* ---------- वीडियो कॉल और लाइव (PeerJS, फ्री) ---------- */
function initPeer() {
  if (peer) return;
  peer = new Peer('y' + Math.random().toString(36).slice(2, 7));
  peer.on('open', id => document.querySelectorAll('.myid').forEach(e => e.textContent = id));
  peer.on('call', async c => {
    try {
      await cam();
      c.answer(local);
      if (hosting) {
        viewers.add(c); count();
        c.on('close', () => { viewers.delete(c); count(); });
      } else show(c, '#rv');
    } catch (e) { toast('कैमरा और माइक की अनुमति दो'); }
  });
  peer.on('error', e => toast('कनेक्शन में दिक्कत: ' + e.type));
}
const count = () => $('#vc').textContent = viewers.size + ' लोग देख रहे हैं';
async function cam() {
  if (!local) local = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: true });
  $('#lv').srcObject = local;
}
function show(c, sel) {
  cur && cur !== c && cur.close();
  cur = c;
  c.on('stream', s => $(sel).srcObject = s);
  c.on('close', () => $(sel).srcObject = null);
}
function dummy() { // देखने वाला सिर्फ रिसीव करता है, इसलिए खाली स्ट्रीम भेजते हैं
  const cv = document.createElement('canvas'); cv.width = cv.height = 16;
  cv.getContext('2d').fillRect(0, 0, 16, 16);
  const s = cv.captureStream(1);
  new AudioContext().createMediaStreamDestination().stream.getAudioTracks().forEach(t => s.addTrack(t));
  return s;
}

$('#call').onclick = async () => {
  const id = $('#fid').value.trim();
  if (!id) return toast('दोस्त का कोड डालो');
  try { await cam(); show(peer.call(id, local), '#rv'); }
  catch (e) { toast('कैमरा और माइक की अनुमति दो'); }
};
$('#end').onclick = () => { cur && cur.close(); cur = null; $('#rv').srcObject = null; };

$('#golive').onclick = async () => {
  try {
    await cam(); hosting = true;
    $('#sv').srcObject = local; $('#sv').muted = true;
    $('#golive').hidden = true; $('#hostinfo').hidden = false; count();
    toast('लाइव शुरू। अपना कोड दोस्तों को भेजो।');
  } catch (e) { toast('कैमरा और माइक की अनुमति दो'); }
};
$('#stoplive').onclick = () => {
  hosting = false; viewers.forEach(c => c.close()); viewers.clear();
  $('#sv').srcObject = null; $('#golive').hidden = false; $('#hostinfo').hidden = true;
};
$('#watch').onclick = () => {
  const id = $('#hid').value.trim();
  if (!id) return toast('लाइव का कोड डालो');
  hosting = false; cur && cur.close();
  const c = peer.call(id, dummy()); cur = c;
  c.on('stream', s => { const v = $('#sv'); v.muted = false; v.srcObject = s; });
  c.on('close', () => $('#sv').srcObject = null);
};
</script>
</body>
</html>
